name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the Python version from .python-version
        run: uv python install

      - name: Install the dependencies
        run: uv sync --frozen --no-dev

      - name: Run the test suite
        run: uv run python -m unittest discover -s tests -v

      - name: Check that every module compiles
        run: >-
          uv run python -m compileall -q
          config.py dates.py fetch.py main.py notif.py parse.py

      - name: Check that the documentation builds
        # The site itself is published with "mkdocs gh-deploy" from a machine
        # with push access; this only makes sure the sources are valid, so a
        # broken page cannot reach the published site.
        run: uv tool run --from mkdocs-material mkdocs build --strict
