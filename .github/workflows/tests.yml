name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the Python version from .python-version
        run: uv python install

      - name: Install the dependencies
        run: uv sync --frozen --no-dev

      - name: Run the test suite
        run: uv run python -m unittest discover -s tests -v

      - name: Check that every module compiles
        run: uv run python -m compileall -q config.py dates.py fetch.py main.py notif.py parse.py

  docs:
    # Publish the documentation only from the default branch, never from a fork
    # or a pull request.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the documentation
        run: uv tool run --from mkdocs-material mkdocs build --strict

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv tool run --from mkdocs-material mkdocs gh-deploy --ignore-version \
            --message "Deployed ${{ github.sha }} from GitHub Actions"
